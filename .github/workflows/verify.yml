name: verify-patchset
on:
  push:
    branches: [main, task/upgrade-patchset]
  workflow_dispatch:
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Targeted tests (patched areas)
        run: |
          set +e
          npx vitest run \
            packages/shared/src/validators/issue.test.ts \
            server/src/__tests__/heartbeat-issue-liveness-escalation.test.ts \
            server/src/__tests__/issue-agent-mutation-ownership-routes.test.ts \
            server/src/__tests__/issue-blocker-attention.test.ts \
            server/src/__tests__/issue-comment-reopen-routes.test.ts \
            server/src/__tests__/issue-dependency-wakeups-routes.test.ts \
            server/src/__tests__/issues-service.test.ts \
            server/src/__tests__/worktree-create-lock.test.ts \
            server/src/services/issue-dependency-wakeups.test.ts \
            --reporter=default --reporter=json --outputFile=targeted.json 2>&1 | tee targeted.log
          echo "exit=${PIPESTATUS[0]}" | tee -a targeted.log
          node -e "const r=require('./targeted.json');console.log(JSON.stringify({files:r.numTotalTestSuites,tests:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,skipped:r.numPendingTests+r.numTodoTests}))" | tee summary.json
          cat summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.ref_name == 'main' && 'baseline' || 'patched' }}
          path: |
            targeted.log
            targeted.json
            summary.json
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Server suite shard ${{ matrix.shard }}/6
        working-directory: server
        run: |
          set +e
          npx vitest run --shard=${{ matrix.shard }}/6 --reporter=default --reporter=json --outputFile=../server-${{ matrix.shard }}.json > ../server-${{ matrix.shard }}.log 2>&1
          echo "exit=$?" >> ../server-${{ matrix.shard }}.log
          cd ..
          node -e "const r=require('./server-${{ matrix.shard }}.json');const f=r.testResults.flatMap(t=>t.assertionResults.filter(a=>a.status==='failed').map(a=>t.name.split('/server/')[1]+' > '+a.fullName));console.log(JSON.stringify({shard:${{ matrix.shard }},tests:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,skipped:r.numPendingTests,failedTests:f}))" | tee server-summary-${{ matrix.shard }}.json
          cat server-summary-${{ matrix.shard }}.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-${{ github.ref_name == 'main' && 'baseline' || 'patched' }}-${{ matrix.shard }}
          path: |
            server-${{ matrix.shard }}.log
            server-summary-${{ matrix.shard }}.json
